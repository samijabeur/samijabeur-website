# Konfiguration für Pages CMS (https://pagescms.org) – steuert, was du im Editor siehst.
# Erzeugt mit tools/make_cms_config.py aus dem festen Seitenraster (layout/*.json).
# Bitte nicht von Hand ändern, außer du weißt, was du tust: Eine Änderung hier verändert nur die
# Eingabemaske, nicht die Website.
components:
  block_text:
    type: object
    fields:
    - name: text
      label: Text
      type: text
      description: Enter = neue Zeile. **fett**, *kursiv*, [Linktext](https://…) oder [Linktext](/vortex) sind möglich.
    - name: style
      label: Aussehen
      type: select
      options:
        values:
        - value: title-xl
          label: Sehr große Überschrift
        - value: title
          label: Große Überschrift
        - value: lead
          label: Großer Text
        - value: body
          label: Normaler Text
        - value: small
          label: Kleiner Text (Fußnote)
    - name: align
      label: Ausrichtung
      type: select
      options:
        values:
        - value: center
          label: Zentriert
        - value: left
          label: Linksbündig
        - value: right
          label: Rechtsbündig
        - value: justify
          label: Blocksatz
  block_image:
    type: object
    fields:
    - name: image
      label: Bild
      type: image
      options:
        media: images
    - name: alt
      label: Bildbeschreibung (für Blinde und Google, optional)
      type: string
    - name: size
      label: Größe
      type: select
      options:
        values:
        - value: full
          label: Volle Breite (bis an den Rand)
        - value: wide
          label: Breit (mit Rand)
        - value: medium
          label: Mittel
        - value: small
          label: Klein
  block_film:
    type: object
    fields:
    - name: video
      label: Video (MP4)
      type: file
      options:
        media: videos
        extensions:
        - mp4
        - webm
    - name: mode
      label: Wiedergabe
      type: select
      options:
        values:
        - value: player
          label: Mit Abspielleiste (Ton, Pause, Vollbild)
        - value: loop
          label: Dauerschleife ohne Ton (wie ein bewegtes Bild)
    - name: ratio
      label: Seitenverhältnis
      type: select
      options:
        values:
        - value: '16:9'
          label: 16:9 (Querformat)
        - value: '4:3'
          label: '4:3'
        - value: '3:2'
          label: '3:2'
        - value: '1:1'
          label: Quadrat
        - value: '9:16'
          label: 9:16 (Hochformat)
    - name: size
      label: Größe
      type: select
      options:
        values:
        - value: full
          label: Volle Breite (bis an den Rand)
        - value: wide
          label: Breit (mit Rand)
        - value: medium
          label: Mittel
        - value: small
          label: Klein
    - name: poster
      label: Vorschaubild (optional; sonst wird ein Bild aus dem Video genommen)
      type: image
      options:
        media: images
    - name: title
      label: Titel des Videos (für Blinde, optional)
      type: string
  block_gallery:
    type: object
    fields:
    - name: layout
      label: Anordnung
      type: select
      options:
        values:
        - value: masonry
          label: Mauerwerk (Bilder in ihrer eigenen Höhe)
        - value: grid
          label: Raster (alle gleich groß)
        - value: strips
          label: Streifen (Bilder nebeneinander in einer Zeile)
    - name: columns
      label: Spalten (bei Mauerwerk und Raster)
      type: select
      options:
        values:
        - value: '2'
          label: '2'
        - value: '3'
          label: '3'
        - value: '4'
          label: '4'
        - value: '5'
          label: '5'
    - name: gap
      label: Abstand zwischen den Bildern
      type: select
      options:
        values:
        - value: none
          label: Kein Abstand
        - value: small
          label: Klein
        - value: medium
          label: Mittel
    - name: width
      label: Breite
      type: select
      options:
        values:
        - value: inset
          label: Mit Rand
        - value: full-bleed
          label: Randlos (bis an den Bildschirmrand)
        - value: full
          label: Fast randlos
    - name: ratio
      label: Bildformat (nur bei Raster)
      type: select
      options:
        values:
        - value: '4:3'
          label: 4:3 Querformat
        - value: '2:3'
          label: 2:3 Hochformat
        - value: '1:1'
          label: Quadrat
    - name: lightbox
      label: Bild beim Anklicken groß zeigen
      type: boolean
      default: true
    - name: images
      label: Bilder
      type: image
      options:
        media: images
        multiple: true
        unique: true
      description: Fotos hier hineinziehen oder hochladen. Reihenfolge durch Ziehen ändern, Foto entfernen über den Papierkorb.
  block_credits:
    type: object
    fields:
    - name: rows
      label: Zeilen
      type: object
      list:
        collapsible:
          collapsed: false
          summary: '{role}: {names}'
      fields:
      - name: role
        label: Rolle (z. B. director)
        type: string
      - name: names
        label: Name(n)
        type: text
        description: 'Mehrere Namen: jeweils in eine neue Zeile.'
  block_tiles:
    type: object
    fields:
    - name: items
      label: Kacheln
      type: object
      list:
        collapsible:
          collapsed: false
          summary: '{title}'
      fields:
      - name: title
        label: Titel
        type: string
      - name: link
        label: Link
        type: string
        description: Seite dieser Website (z. B. /vortex) oder eine Adresse mit https://
      - name: image
        label: Bild
        type: image
        options:
          media: images
      - name: video
        label: oder Video (hat Vorrang vor dem Bild)
        type: file
        options:
          media: videos
          extensions:
          - mp4
          - webm
  block_spacer:
    type: object
    fields:
    - name: height
      label: Höhe
      type: select
      options:
        values:
        - value: small
          label: Klein
        - value: medium
          label: Mittel
        - value: large
          label: Groß
media:
- name: images
  label: Bilder
  input: media/images
  output: /media/images
  rename: safe
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  - gif
- name: videos
  label: Videos und Filme
  input: media/video
  output: /media/video
  rename: safe
  extensions:
  - mp4
  - webm
