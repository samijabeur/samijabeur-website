- name: new_pages
  label: Neue Seiten
  type: collection
  path: content/new-pages
  format: json
  filename: '{primary}.json'
  subfolders: false
  view:
    fields:
    - name
    - menu
    primary: name
    default:
      sort: name
      order: asc
    sort:
    - name
  fields:
  - name: name
    label: Name der Seite (z. B. MEIN PROJEKT)
    type: string
    required: true
    description: 'Der Name bestimmt auch die Adresse der Seite: „MEIN PROJEKT“ wird zu samijabeur.com/mein-projekt/'
  - name: description
    label: Beschreibung für Google (1 bis 2 Sätze, optional)
    type: text
  - name: menu
    label: Im Menü anzeigen
    type: select
    options:
      values:
      - value: projects
        label: Unter „projects“
      - value: main
        label: Im Hauptmenü
      - value: none
        label: Nicht im Menü
    default: projects
  - name: menu_label
    label: Name im Menü (optional, sonst der Seitenname)
    type: string
  - name: order
    label: Reihenfolge im Menü (optional; 1 = zuerst, sonst alphabetisch hinten)
    type: number
  - name: blocks
    label: Inhalt der Seite
    type: block
    blockKey: type
    list:
      collapsible:
        collapsed: true
        summary: '{type}'
    blocks:
    - name: text
      label: Text / Überschrift
      component: block_text
    - name: image
      label: Bild
      component: block_image
    - name: film
      label: Film / Video
      component: block_film
    - name: gallery
      label: Galerie
      component: block_gallery
    - name: credits
      label: Credits (Rollen und Namen)
      component: block_credits
    - name: tiles
      label: Projekt-Kacheln
      component: block_tiles
    - name: spacer
      label: Abstand
      component: block_spacer
    description: Baustein für Baustein von oben nach unten. Mit „Hinzufügen“ kommt ein neuer Baustein dazu.
- name: config
  label: Menü und Einstellungen
  type: group
  items:
  - name: footer
    label: Fußzeile (unten auf jeder Seite)
    type: file
    path: content/footer.json
    format: json
    fields:
    - name: link_label
      label: 'Links: Name des Links (z. B. imprint; leer = nichts anzeigen)'
      type: string
    - name: link_url
      label: 'Links: Seite oder Adresse (z. B. /imprint/)'
      type: string
    - name: copyright
      label: 'Mitte: Text (z. B. © sami jabeur)'
      type: string
    - name: social
      label: 'Rechts: Social-Media-Symbole (auch auf der About-Seite)'
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{network}'
      fields:
      - name: network
        label: Netzwerk
        type: select
        options:
          values:
          - value: instagram
            label: Instagram
          - value: linkedin
            label: LinkedIn
      - name: url
        label: Adresse (https://…)
        type: string
  - name: navigation
    label: Menü
    type: file
    path: content/navigation.json
    format: json
    fields:
    - name: items
      label: Menüpunkte
      type: object
      list:
        collapsible:
          collapsed: false
          summary: '{label}'
      description: Reihenfolge durch Ziehen ändern. Ein Menüpunkt mit Unterpunkten ist ein Ordner (Link dann leer lassen).
      fields:
      - name: label
        label: Name im Menü
        type: string
      - name: link
        label: Seite (z. B. /about; Startseite = /)
        type: string
      - name: children
        label: Unterpunkte (nur bei Ordnern)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{label}'
        fields:
        - name: label
          label: Name im Menü
          type: string
        - name: link
          label: Seite (z. B. /vortex)
          type: string
  - name: site
    label: Website-Einstellungen
    type: file
    path: content/site.json
    format: json
    fields:
    - name: site_name
      label: Name der Website (Logo oben links)
      type: string
    - name: title_prefix
      label: Vorspann der Seitentitel (z. B. „Sami Jabeur“ ergibt „Sami Jabeur | Vortex“)
      type: string
    - name: domain
      label: Domain (z. B. www.samijabeur.com)
      type: string
      description: Nur ändern, wenn sich die Adresse der Website ändert. Muss auch in GitHub unter Settings → Pages eingetragen sein.
    - name: default_description
      label: Standard-Beschreibung für Google (wenn eine Seite keine eigene hat)
      type: text
    - name: cookie_text
      label: Cookie-Hinweis (Text; leer lassen = kein Banner)
      type: text
    - name: cookie_button
      label: Cookie-Hinweis (Button)
      type: string
settings:
  commit:
    templates:
      create: 'Neu angelegt: {path}'
      update: 'Geändert: {path}'
      delete: 'Gelöscht: {path}'
      rename: 'Umbenannt: {oldPath} → {newPath}'
